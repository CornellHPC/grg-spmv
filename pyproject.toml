[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pygrgl-spmv"
version = "0.1.0"
description = "Sparse matmul kernels for GRG-based genotype matrices"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "AprilWeiLab" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "pygrgl",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.6.0"]
dev = [
    "pytest>=9.0.2",
    "grapp>=0.3",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "igdtools>=2.6",
]

[tool.hatch.build.targets.wheel]
packages = ["pygrgl_spmv"]
exclude = [
    "pygrgl_spmv/tests/**",
    "pygrgl_spmv/**/__pycache__/**",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "/pygrgl_spmv",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "/pygrgl_spmv/tests/**",
    "/archived",
    "/external",
    "/figs",
    "/text",
    "/scripts",
    "/dist",
    "/.venv",
]

[tool.pytest.ini_options]
markers = [
    "smoke: core fast tests selected by --smoke",
    "gpu: tests requiring a GPU (CuPy + cuSPARSE)",
    "mkl: tests specific to MKL backend",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
pythonPlatform = "x86_64-unknown-linux-gnu"

[tool.uv.sources]
pygrgl = { git = "ssh://git@github.com/nalzok/grgl.git", rev = "nalzok-patch-submodule" }
